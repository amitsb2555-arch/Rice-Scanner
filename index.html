<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rice Quality Scanner</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f2;color:#111}
.box{background:white;margin:15px;padding:15px;border-radius:15px}
h1{text-align:center}
button,input,select{width:100%;padding:13px;margin:6px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ccc}
button{background:#111;color:white;font-weight:bold}
#preview{width:100%;margin-top:10px;border-radius:10px}
.result{font-size:18px;line-height:1.6}
</style>
</head>
<body>
<div class="box">
<h1>🌾 Rice Quality Scanner</h1>

<label>Analysis Mode</label>
<select id="mode">
<option value="raw">Uncooked Rice Analysis</option>
<option value="cooked">Cooking Analysis</option>
</select>

<label>Lot / Variety</label>
<input id="lot" placeholder="Enter Lot / Variety">

<label>Calibration reference length (mm)</label>
<input id="ref" type="number" step="0.01" value="10">

<label>Reference length in image (pixels)</label>
<input id="refpx" type="number" step="1" value="100">

<label>Rice photo</label>
<input id="photo" type="file" accept="image/*" capture="environment">

<img id="preview" hidden>

<button onclick="scan()">SCAN RICE</button>

<div id="result" class="result"></div>
</div>

<script>
const photo=document.getElementById('photo');
const preview=document.getElementById('preview');

photo.onchange=()=>{
 const f=photo.files[0];
 if(!f)return;
 preview.src=URL.createObjectURL(f);
 preview.hidden=false;
};

function scan(){
 const ref=parseFloat(document.getElementById('ref').value);
 const refpx=parseFloat(document.getElementById('refpx').value);
 const lot=document.getElementById('lot').value||'Not entered';
 const mode=document.getElementById('mode').value;

 if(!photo.files.length){
   alert('Please take/select a rice photo first.');
   return;
 }
 if(!ref||!refpx){
   alert('Please enter calibration values.');
   return;
 }

 const mmPerPx=ref/refpx;

 document.getElementById('result').innerHTML=
 `<hr><b>Lot / Variety:</b> ${lot}<br>
 <b>Mode:</b> ${mode==='raw'?'Uncooked':'Cooking'}<br>
 <b>Calibration:</b> ${mmPerPx.toFixed(4)} mm/pixel<br><br>
 <b>Next:</b> Use a clear top-view photo with a known scale/reference beside the rice.`;
}
</script>
</body>
</html>
